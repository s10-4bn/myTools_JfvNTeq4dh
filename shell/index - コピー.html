<!DOCTYPE html> 
<html>
<head> 
<meta charset=UTF-8">
<link rel="shortcut icon" type="image/x-icon" href="http://s10-4bn.sunnyday.jp/family/images/favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>貝殻記録</title> 
<link rel="stylesheet" type="text/css" href="../_css/reset.css">
<link type="text/css" rel="stylesheet" href="../_css/prmenu.css" />
<link rel="stylesheet" type="text/css" href="css/main.css">

<script type="text/javascript" src="http://maps.googleapis.com/maps/api/js?key=AIzaSyCb8PavWo2x5mnndiskqEET4tb5iUkkpIc&libraries=geometry"></script> 
<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js"></script>
<script src="js/localPhotoset.js"></script> 
<script src="../_js/jQuery.simplyModal.js"></script> 
<script src="../_js/GM.lib.js"></script> 
<script src="../_js/jQuery.showImgSequence.js"></script>
<script src="../_js/imagesLoader.js"></script>
<script src="../_js/loading.js"></script>
<script src="js/local.js"></script> 
<script src="shells.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

<script>
    if (typeof EXIF !== "undefined") {
        EXIF.enableXmp();
    }
</script>

</head> 

<body> 
	
	<div id="initialize">
		<input type="file"
		       id="localPhotoFolder"
		       webkitdirectory
		       directory
		       multiple
		       accept=".jpg,.jpeg,image/jpeg"
		       style="display:none;">
		
		<button id="selectLocalPhotoFolder">"貝殻記録"フォルダを選択</button>
	</div>
	
	<dic id="photosets">

		<div id="logout">ログアウト</div>
	    <div id="photo-container">
	        <div id="btn-top">Top</div>
	        <div id="contents">
	            <div id="photo-header">
	                <div id="title">貝殻記録</div>
	                <hr>
	                <div id="photo-to-map-wrapper">
	                    <div id="photo-to-map" class="button" >図鑑</div>
	                </div>
	            </div>
	
	            <div id="record-container"></div> 
	    		<div id="book-container"></div>
	        </div>
	    </div>

	</div>

</body> 



</html>
